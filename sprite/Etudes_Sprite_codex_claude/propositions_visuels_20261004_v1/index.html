<body><main>

<span class="kicker" data-fr="Présentation pédagogique · propositions séparées" data-en="Pedagogical presentation · separate proposals"></span>
<h1 data-fr="Quatre visuels pour compléter la page" data-en="Four visuals to complete the page"></h1>
<p data-fr="Les trois cadres manquants sont couverts par quatre propositions. Les sprites viennent des données Q3m conservées ; les fonds sont dessinés spécialement pour ces simulations. Les planches et les explorations utilisent les mêmes données." data-en="Four proposals cover the three missing placeholders. Sprites come from preserved Q3m data; backgrounds were drawn specifically for these simulations. The boards and interactive explorations use the same data."></p>
<p class="notice" data-fr="Aperçu à valider avant intégration. Les deux présentations FR/EN existantes restent inchangées. Ces rendus sont hors jeu : ils expliquent les mécanismes sans remplacer les captures, mesures ou validations ingame." data-en="Preview awaiting approval before integration. The existing French and English presentations remain unchanged. These offline renders explain the mechanisms without replacing in-game captures, measurements or validation."></p>
<nav class="toc"><a href="#a" data-fr="A · Équipements" data-en="A · Equipment"></a><a href="#b" data-fr="B · Filtres" data-en="B · Filters"></a><a href="#c" data-fr="C · Profils V7" data-en="C · V7 profiles"></a><a href="#d" data-fr="D · Contours alpha" data-en="D · Alpha contours"></a></nav>

<section class="proposal" id="a">
<div class="placement" data-fr="Emplacement proposé : chapitre 05 · cadre assembly-capture" data-en="Proposed placement: chapter 05 · assembly-capture placeholder"></div>
<h2 data-fr="A · Comment les équipements se rejoignent" data-en="A · How equipment layers fit together"></h2>
<p data-fr="Le corps, le casque, le bouclier et l’arme ont leurs propres images. Leurs centres servent à les placer autour du même point de référence. Ce centre peut se trouver hors du rectangle d’un petit équipement, comme le casque." data-en="The body, helmet, shield and weapon each have their own images. Their centres place them around the same reference point. The centre can lie outside a small equipment rectangle, as with the helmet."></p>
<figure><img class="board" data-board="a" src="assets/proposal-a-fr.png" alt="Quatre calques séparés, centres et assemblage sur un fond quadrillé" width="1600" height="690"><figcaption data-fr="Proposition statique : quatre calques Q3m K6 x2 synchronisés, repères et rectangles natifs, puis composition hors jeu. L’ordre des calques est fixe pour cette démonstration ; il ne reproduit pas tous les ordres dépendant de la direction. La palette neutre est commune." data-en="Static proposal: four synchronized Q3m K6 x2 layers, native reference points and rectangles, followed by an offline composite. Layer order is fixed for this demonstration and does not reproduce every direction-dependent order. A neutral palette is shared."></figcaption></figure>
<details open><summary data-fr="Explorer les calques, les poses et les couleurs" data-en="Explore layers, poses and colours"></summary>
<div class="controls">
<label><span data-fr="Pose synchronisée" data-en="Synchronized pose"></span><select id="assembly-pose"></select></label>
<label><span data-fr="Palette K6 conservée" data-en="Preserved K6 palette"></span><select id="assembly-palette"></select></label>
<label><span data-fr="Fond personnalisé" data-en="Custom background"></span><select id="assembly-bg" class="bg-options"><option value="grid" data-fr="Plan technique" data-en="Technical grid"></option><option value="stone" data-fr="Pierre sombre" data-en="Dark stone"></option><option value="parchment" data-fr="Parchemin clair" data-en="Light parchment"></option></select></label>
<label class="inline"><input type="checkbox" id="assembly-anchors" checked><span data-fr="Repères et limites" data-en="Reference points and bounds"></span></label>
</div><div class="controls" id="layer-toggles"></div><div class="cards assembly-grid" id="assembly-cards"></div>
<p class="equation" data-fr="Origine du calque = référence commune − centre × zoom" data-en="Layer origin = shared reference − centre × zoom"></p>
<p class="hint" data-fr="Affichage pédagogique au zoom natif ×3 ; pixels du x2 agrandis sans interpolation. Trois poses réellement synchronisées sont disponibles. Les effets, l’éclairage et les occultations du moteur ne sont pas simulés." data-en="Teaching display at native zoom ×3; x2 pixels enlarged without interpolation. Three genuinely synchronized poses are available. Engine effects, lighting and occlusion are not simulated."></p>
</details></section>

<section class="proposal" id="b">
<div class="placement" data-fr="Emplacement proposé : chapitre 11 · cadre filter-capture" data-en="Proposed placement: chapter 11 · filter-capture placeholder"></div>
<h2 data-fr="B · Ce qui se passe quand le sprite rétrécit" data-en="B · What happens when a sprite shrinks"></h2>
<p data-fr="Une texture agrandie doit souvent être réduite à l’écran. Nearest choisit un texel, BOX moyenne toute la surface couverte, les mipmaps utilisent des copies réduites et Catmull-Rom reconstruit un voisinage local. Les quatre colonnes conservent la même pose, la même texture et le même zoom." data-en="An upscaled texture often needs to shrink on screen. Nearest picks a texel, BOX averages the entire covered area, mipmaps use reduced copies and Catmull-Rom reconstructs a local neighbourhood. All four columns keep the same pose, texture and zoom."></p>
<figure><img class="board" data-board="b" src="assets/proposal-b-fr.png" alt="Comparaison simulée de Nearest, BOX, mipmaps et Catmull-Rom" width="1600" height="810"><figcaption data-fr="La planche compare les filtres sur une texture x4 pour que le mode mipmaps soit dans son périmètre testé. Les loupes agrandissent les pixels déjà affichés. Le choix Character acquis reste x2 + BOX ; une simulation ne décide pas à nouveau de la QA." data-en="The board compares filters on an x4 texture so mipmaps stay within their tested scope. Close-ups enlarge the already displayed pixels. The established Character choice remains x2 + BOX; a simulation does not reassess QA."></figcaption></figure>
<details open><summary data-fr="Comparer les filtres ou les textures x2 / x4" data-en="Compare filters or x2 / x4 textures"></summary>
<div class="controls">
<label><span data-fr="Comparaison" data-en="Comparison"></span><select id="filter-mode"><option value="filters" data-fr="4 filtres · même texture" data-en="4 filters · same texture"></option><option value="scales" data-fr="x2 / x4 · même filtre BOX" data-en="x2 / x4 · same BOX filter"></option></select></label>
<label><span data-fr="Texture" data-en="Texture"></span><select id="filter-scale"><option value="4">x4</option><option value="2">x2</option></select></label>
<label><span data-fr="Zoom natif à l’écran" data-en="Native screen zoom"></span><select id="filter-zoom"><option value="0.823">×0.823</option><option value="1.35" selected>×1.35</option><option value="2.48">×2.48</option><option value="4">×4</option></select></label>
<label><span data-fr="Pose" data-en="Pose"></span><select id="filter-pose"></select></label>
<label><span data-fr="Fond" data-en="Background"></span><select id="filter-bg"><option value="stone" data-fr="Pierre sombre" data-en="Dark stone"></option><option value="parchment" data-fr="Parchemin clair" data-en="Light parchment"></option><option value="grid" data-fr="Plan technique" data-en="Technical grid"></option></select></label>
<label><span data-fr="Position sous-pixel" data-en="Subpixel position"></span><input type="range" id="filter-phase" min="0" max="0.75" value="0.25" step="0.25"></label>
<button type="button" id="filter-render" data-fr="Recalculer" data-en="Recalculate"></button>
</div><p id="filter-status" class="hint" aria-live="polite"></p><div class="cards filter-grid" id="filter-cards"></div><p class="hint" id="mip-storage"></p>
<p class="hint" data-fr="BOX et Catmull-Rom suivent les formules du shader, couche par couche, avec alpha prémultiplié. La pyramide mipmap est un modèle CPU par moyennes d’aire RGBA8 : le noyau du pilote OpenGL n’est pas reproduit. Les marges transparentes sont supposées isolées. Les différences de précision GPU, de FPS et d’occlusion ne sont pas représentées." data-en="BOX and Catmull-Rom follow the shader formulas layer by layer with premultiplied alpha. The mipmap pyramid uses a CPU model of RGBA8 area averages: the OpenGL driver kernel is not reproduced. Transparent borders are assumed isolated. GPU precision, FPS and occlusion differences are not represented."></p>
<p data-fr="La comparaison x2 / x4 utilise les véritables textures conservées, sans inventer de détail. Elle complète la vidéo déjà validée : le ressenti plus naturel du x2 et l’aspect parfois plastique du x4 restent des appréciations visuelles, pas des mesures calculées ici." data-en="The x2 / x4 comparison uses the actual preserved textures without inventing detail. It complements the already approved video: the more natural feel of x2 and the sometimes plastic appearance of x4 remain visual judgments, not measurements computed here."></p>
</details></section>

<section class="proposal" id="c">
<div class="placement" data-fr="Emplacement proposé : chapitre 14 · première partie du cadre creature-capture" data-en="Proposed placement: chapter 14 · first part of creature-capture"></div>
<h2 data-fr="C · Pourquoi V7 adapte les partenaires de couleur" data-en="C · Why V7 adapts colour partners"></h2>
<figure><img class="board" data-board="c" src="assets/proposal-c-fr.png" alt="Profils de créatures V7 et quatre partenaires de couleur" width="1600" height="905"><figcaption data-fr="Quatre exemples représentatifs, puis une table de partenaires réellement lue dans le témoin Spectateur. Les huit cases de chaque ligne montrent F = 0…7. B choisit le partenaire ; il ne désigne pas un mélange de matériaux." data-en="Four representative examples followed by a partner table actually read from the Spectator witness. The eight cells in each row show F = 0…7. B selects the partner; it does not identify a material blend."></figcaption></figure>
<details open><summary data-fr="Galerie des 15 témoins et tables de partenaires" data-en="Gallery of all 15 witnesses and partner tables"></summary>
<div class="controls"><label><span data-fr="Fond" data-en="Background"></span><select id="gallery-bg"><option value="stone" data-fr="Pierre sombre" data-en="Dark stone"></option><option value="grid" data-fr="Plan technique" data-en="Technical grid"></option><option value="parchment" data-fr="Parchemin clair" data-en="Light parchment"></option></select></label></div>
<div class="cards gallery" id="gallery-cards"></div><div class="partner-box"><h3 id="partner-title"></h3><p class="mono hint" id="partner-meta"></p><div class="partner-rows" id="partner-rows"></div></div>
<p class="hint" data-fr="Rendus Q3m V7 x2 avec la palette K6 #0 de l’oracle conservé. Les grands témoins sont ajustés à leur carte ; les tailles relatives entre espèces ne se comparent pas ici. La wyverne assemble quatre parties, le dragon neuf. Les armes ou actions absentes du pilote ne sont pas ajoutées. Le Character montré ici est un témoin V7 ; les 78 Character acquis restent sur leur production V6." data-en="Q3m V7 x2 renders use K6 palette #0 from the preserved oracle. Large witnesses are fitted to their cards, so relative species sizes cannot be compared here. The wyvern assembles four parts and the dragon nine. Weapons or actions absent from the pilot are not added. The Character shown here is a V7 witness; the established 78 Character remain on their V6 production."></p>
<p class="hint" data-fr="La galerie montre des poses et des contrats, pas une validation globale des 15 familles. Les statuts de production et de QA restent ceux de chaque candidat." data-en="The gallery shows poses and contracts, not blanket validation of all 15 families. Production and QA status remain specific to each candidate."></p>
</details></section>

<section class="proposal" id="d">
<div class="placement" data-fr="Emplacement proposé : chapitre 14 · deuxième partie du cadre creature-capture" data-en="Proposed placement: chapter 14 · second part of creature-capture"></div>
<h2 data-fr="D · Distinguer couleur et transparence du contour" data-en="D · Distinguish colour from contour transparency"></h2>
<figure><img class="board" data-board="d" src="assets/proposal-d-fr.png" alt="Ankheg original, spline et alpha léger sur deux fonds" width="1600" height="1120"><figcaption data-fr="Même frame MAKHG1 #11 pour le Q3m original, Spline Fit 1 et l’alpha léger. Les plans I/F, les valeurs RGB et la géométrie sont identiques pour la frame montrée ; seule la couverture alpha change. Le corps est montré sans sa couche de terre pour rendre son contour lisible." data-en="The same MAKHG1 frame #11 is shown for original Q3m, Spline Fit 1 and light alpha. I/F planes, RGB values and geometry are identical for the displayed frame; only alpha coverage changes. The body is shown without its earth layer to make the contour readable."></figcaption></figure>
<details open><summary data-fr="Changer le fond et examiner le contour" data-en="Change the background and inspect the contour"></summary>
<div class="controls"><label><span data-fr="Fond" data-en="Background"></span><select id="alpha-bg"><option value="parchment" data-fr="Parchemin clair" data-en="Light parchment"></option><option value="stone" data-fr="Pierre sombre" data-en="Dark stone"></option><option value="grid" data-fr="Plan technique" data-en="Technical grid"></option></select></label><label><span data-fr="Loupe sans interpolation" data-en="Close-up without interpolation"></span><select id="alpha-magnify"><option value="4">×4</option><option value="5" selected>×5</option><option value="6">×6</option></select></label></div><div class="cards alpha-grid" id="alpha-cards"></div>
<p class="equation" data-fr="Alpha affiché = alpha de la palette × masque A / 255" data-en="Displayed alpha = palette alpha × mask A / 255"></p>
<p class="hint" data-fr="Le rectangle turquoise indique le même détail dans les trois images. La loupe utilise Nearest pour isoler le masque A ; elle ne reproduit pas la combinaison Catmull-Rom de l’essai ingame. Spline Fit 1 a été rejeté ; l’alpha léger attend sa QA. Le choix du détail privilégie une zone réellement modifiée, identique pour les trois candidats." data-en="The teal rectangle marks the same detail in all three images. The close-up uses Nearest to isolate mask A; it does not reproduce the Catmull-Rom combination used in the in-game trial. Spline Fit 1 was rejected; light alpha awaits QA. The detail is selected from a genuinely modified region and remains identical for all three candidates."></p>
</details></section>

<section class="proposal"><h2 data-fr="Format proposé pour la page" data-en="Proposed format for the page"></h2>
<p data-fr="Intégrer les quatre planches FR/EN avec leurs légendes courtes, puis les explorations interactives repliables. Les fonds sobres reprennent l’encre, l’or et le parchemin de la présentation. La vidéo comparative existante reste sa propre démonstration ingame. L’intégration sera faite après validation des propositions." data-en="Integrate the four French/English boards with short captions, followed by collapsible interactive explorations. Restrained backgrounds follow the presentation’s ink, gold and parchment palette. The existing comparison video remains its own in-game demonstration. Integration will follow approval of the proposals."></p>
