; InfinityEngine-Enhancer sample configuration
; Place in the game root, next to the game executable, and adjust only when needed.

[Core]
VerboseLogs = false
; Aggregate render timings and registry-backed area-animation clock measurements every five seconds.
PerformanceLogs = false

[Rendering]
EnableAnisotropicFiltering = false
MaxAnisotropy = 8.0
LODBias = -0.25
; Diagnostic: applies FXAA to the complete frame (world and UI) at presentation.
EnableFullFrameFXAA = false
; Diagnostic: render the complete frame at 2x per axis, then reduce it.
EnableFullFrameSSAA2x = false
; Temporary WTPOOL diagnostic: logs index transitions of one WPOOL00 CVidTile.
EnableWTPOOLTileTrace = false
; Temporary A/B: bypass the custom RenderTexture path only for WPOOL00.
BypassWTPOOLTileRenderHook = false
; Per-page PVRZ diagnostic: performs guarded reads and an INFO flush on each first draw.
; Leave false for normal play and performance measurements.
EnableTilePageDiagnostics = false
; Experimental BG2EE 2.7.3 map-page prewarm. Disabled by default; missing pages
; always use the engine's normal synchronous Demand path. PerformanceLogs must
; also be true so the first native-cache eviction can stop the experiment.
EnableMapPagePrewarm = false
; Phase 3e-A shadow probe: reads and inflates override PVRZ pages on one bounded
; worker, but never changes native resources or GL state. Requires PerformanceLogs.
EnableMapPageOffframeProbe = false
; Phase 3e-B2 bounded diagnostic: use only the compile-time fixed number of
; strictly matched prepared pages. Requires PerformanceLogs=true. Default off.
EnableMapPageOffframeConsume = false
MapPagePrewarmPagesPerFrame = 1
MapPagePrewarmBudgetMs = 8.0
; The maximum is 96, reserving 32 of the evidenced 128 native PVR slots.
MapPagePrewarmMaxPages = 96
MapPagePrewarmDelayFrames = 30

[Shaders]
; Diagnostic only: archive original shaders to iee-shader-dumps/ next to the DLL.
DumpEngineShaders = false
; F10 toggles the visual effect of overrides (uIeeEnabled) for A/B comparison.
EnableDebugHotkeys = false
; Start the bundled water shader enabled when it is installed in the game's override directory.
EnableWaterEffect = true
; Temporary BAM/UI research. Logs texture uploads and callers only; no asset is replaced.
EnableBamUiTextureProbe = false
; Reversible prototype: AM3000A frame 000 is uploaded at x4 but drawn at native size.
EnableAM3000AFrameX4Test = false
; Reversible prototype: fingerprinted AM0700A fountain animation at x4, native draw size.
EnableAM0700AAnimationX4Test = false
; Reversible prototype: fingerprinted AM0205E ground animation at x4, native draw size.
EnableAM0205EAnimationX4Test = false
; External multi-resource area-animation pack. Required for the animation clock probe.
EnableAreaAnimationX4 = false
; Phase-0 diagnostics only: correlate native WED clipping with xN final draws.
; No pixels or render state are changed. BG2EE 2.7.3 only; restart after changing it.
EnableNativeOcclusionProbe = false
EnableNativeOcclusionBridge = false
; External xN creature-sprite registry. Geometry remains native.
EnableCreatureSpriteUpscaleTest = false
; Legacy alias for the historical x2 creature-sprite test.
EnableCreatureSpriteX2Test = false
; Local display-only A/B for the xN creature-sprite backing. false=NEAREST (QA/release);
; true=LINEAR (not eligible for formal sprite QA). Restart the game after changing it.
EnableCreatureSpriteLinearFiltering = false
; AR1300 bridge transition: the rendered WED door state drives opening, closing and
; live reversal; F9 remains an opening-only diagnostic. Runtime validated with the
; classic 2048-square media; SeedVR2 7B x4 media QA remains pending.
EnableBridgeTransitionPreview = false
; Reversible visual test: inject the BIGLOGO x4 atlas, keeping the original BAM size.
EnableBigLogoX4Test = false
