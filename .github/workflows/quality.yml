name: quality

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s pipeline/tests -p "test_*.py"

  release-manifests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./releases/BG2-HD-Upscale/tools/Test-BG2HD-Phase2.ps1

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S engine/InfinityEngine-Enhancer/source-patchee -B build/iee -DBUILD_TESTING=ON
      - run: cmake --build build/iee --parallel 2
      - run: ctest --test-dir build/iee --output-on-failure
