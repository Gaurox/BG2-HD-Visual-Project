name: local-tests

on:
  push:
  pull_request:

jobs:
  changed-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = [string]$env:BASE_SHA
          if (-not $base -or $base -match '^0+$') {
            Write-Output 'No comparison base; no automatic test escalation.'
            exit 0
          }
          python pipeline/scripts/test_changed.py --changed --base $base --run
