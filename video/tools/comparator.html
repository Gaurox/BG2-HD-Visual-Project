<header>
 <div class="row">
  <div class="brand">BG2 HD <span style="color:#728698">/ COMPARATEUR</span></div>
  <label class="field"><span>GAUCHE</span><select id="sourceSelect" aria-label="Vidéo gauche"></select></label>
  <label class="file">Ouvrir à gauche<input id="sourceFile" type="file" accept="video/*,.wbm,.mkv,.mov"></label>
  <label class="field"><span>DROITE</span><select id="resultSelect" aria-label="Vidéo droite"></select></label>
  <label class="file">Ajouter des essais<input id="resultFiles" type="file" multiple accept="video/*,.wbm,.mkv,.mov"></label>
 </div>
 <div class="row">
  <button class="primary" id="play" disabled>▶ Lecture</button><button id="restart" title="Revenir au début">↶ Début</button>
  <label class="check"><input type="checkbox" id="loop" checked>Boucle</label>
  <button id="sound" title="Audio de la source uniquement">Son coupé</button>
  <select id="speed" aria-label="Vitesse de lecture"><option value="0.25">×0,25</option><option value="0.5">×0,5</option><option value="1" selected>×1</option><option value="2">×2</option></select>
  <span class="spacer"></span><span class="optional muted">Zoom</span><input id="zoom" aria-label="Zoom" type="range" min="1" max="8" step="0.05" value="1"><span id="zoomText">100 %</span>
  <button id="fit">Ajuster</button><button id="pixels" class="optional" title="Un pixel du traitement pour un pixel d’affichage">Pixels 1:1</button><button id="center" title="Recentrer la séparation">50 / 50</button><button id="fullscreen">Plein écran</button>
 </div>
</header>
<main id="stage" aria-label="Comparaison vidéo : deux vidéos avec séparation mobile">
 <div class="layer"><div class="scene" id="leftScene"><video id="source" playsinline preload="auto" muted></video></div></div>
 <div class="layer" id="rightLayer"><div class="scene" id="rightScene"><video id="result" playsinline preload="auto" muted></video></div></div>
 <div class="tag left"><strong>GAUCHE</strong><span id="sourceTag"></span><span id="sourceMeta" class="muted"></span></div>
 <div class="tag right"><strong>DROITE</strong><span id="resultTag"></span><span id="resultMeta" class="muted"></span></div>
 <div class="divider" id="divider" role="slider" tabindex="0" aria-label="Position de la séparation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="handle">‹ ›</span></div>
 <div id="status" role="status" aria-live="polite">Chargement des vidéos…</div>
</main>
<div class="loop-strip">
 <span class="optional muted">PLAGE DE BOUCLE</span>
 <label>Début <input id="loopStartValue" aria-label="Début de boucle en secondes" type="number" min="0" max="1" step="0.01" value="0" disabled></label>
 <div class="loop-range" id="loopRange"><div class="loop-track"></div><input id="loopStart" aria-label="Début de boucle" type="range" min="0" max="1" step="0.01" value="0" disabled><input id="loopEnd" aria-label="Fin de boucle" type="range" min="0" max="1" step="0.01" value="1" disabled></div>
 <label>Fin <input id="loopEndValue" aria-label="Fin de boucle en secondes" type="number" min="0" max="1" step="0.01" value="1" disabled></label>
 <button id="resetLoop" title="Rétablir la durée complète">Tout</button>
</div>
<footer class="bottom"><span id="time">00:00 / 00:00</span><input id="seek" type="range" min="0" max="1" value="0" step="0.001" aria-label="Position de lecture"><span class="hint">Espace : lecture · ← → : image · Molette : zoom · Glisser : déplacer · Double-clic : ajuster</span></footer>

);
sourceItems.push(...resultItems.map(item=>({...item})));
let loopStart=0,loopEnd=null;
let playing=false,ready=false,loading=false,version=0,split=50,zoom=1,panX=0,panY=0,seeking=false,drag=null,frameRate=15;
function fill(select,items){select.replaceChildren(...items.map((x,i)=>new Option(x.name,String(i))))}
fill($('sourceSelect'),sourceItems);fill($('resultSelect'),resultItems);
function notice(t){$('status').textContent=t}
function pause(){playing=false;source.pause();result.pause();$('play').textContent='▶ Lecture'}
function duration(){return Math.min(source.duration||0,result.duration||0)}
function loopLimits(){const d=duration(),gap=Math.min(1/frameRate,d);const end=Math.max(gap,Math.min(loopEnd??d,d));return {start:Math.max(0,Math.min(loopStart,end-gap)),end}}

function editLoop(edge,value){if(!ready||!Number.isFinite(value))return;const d=duration(),gap=Math.min(1/frameRate,d),old=loopLimits();if(edge==='start'){loopStart=Math.max(0,Math.min(value,old.end-gap))}else{loopEnd=Math.max(old.start+gap,Math.min(value,d))}renderLoop();const bounds=loopLimits();if(!playing)seek(edge==='start'?bounds.start:Math.max(bounds.start,bounds.end-1/frameRate));else if($('loop').checked&&(source.currentTime<bounds.start||source.currentTime>=bounds.end))seek(bounds.start)}

function seek(t){source.currentTime=safeTime(source,t);result.currentTime=safeTime(result,t);updateTime()}

async function change(which){const token=++version,wasPlaying=playing,t=source.currentTime||0;pause();loading=true;ready=false;$('play').disabled=true;notice('Chargement…');try{const jobs=[];if(which!=='result'){const item=sourceItems[Number($('sourceSelect').value)];$('sourceTag').textContent=item.name;jobs.push(loadVideo(source,item.url))}if(which!=='source'){const item=resultItems[Number($('resultSelect').value)];$('resultTag').textContent=item.name;jobs.push(loadVideo(result,item.url))}await Promise.all(jobs);if(token!==version)return;ready=source.readyState>=1&&result.readyState>=1;loading=false;$('play').disabled=!ready;if(!ready){notice('Choisissez une vidéo pour chaque côté.');return}$('sourceMeta').textContent=`${source.videoWidth} × ${source.videoHeight}`;$('resultMeta').textContent=`${result.videoWidth} × ${result.videoHeight}`;frameRate=Math.max(sourceItems[Number($('sourceSelect').value)].fps||15,resultItems[Number($('resultSelect').value)].fps||15);renderLoop();seek(Math.min(t,duration()-0.01));notice('');if(wasPlaying)await play()}catch(e){if(token===version){loading=false;notice(e.message)}}}

function setZoom(z,x=stage.clientWidth/2,y=stage.clientHeight/2){const prev=zoom;zoom=Math.max(1,Math.min(8,z));panX=(panX-(x-stage.clientWidth/2))*zoom/prev+(x-stage.clientWidth/2);panY=(panY-(y-stage.clientHeight/2))*zoom/prev+(y-stage.clientHeight/2);transform()}
function fit(){zoom=1;panX=panY=0;transform()}
function fmt(t){if(!Number.isFinite(t))return'00:00';return`${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}`}

function tick(){if(ready){updateTime();if(playing){if(source.ended||result.ended||source.currentTime>=($('loop').checked?loopLimits().end:duration())-0.015){if($('loop').checked){pause();seek(loopLimits().start);play()}else pause()}else if(!seeking&&!source.seeking&&!result.seeking&&Math.abs(result.currentTime-source.currentTime)>0.045){result.currentTime=safeTime(result,source.currentTime)}}}requestAnimationFrame(tick)}

let resumeAfterSeek=false;$('seek').onpointerdown=()=>{resumeAfterSeek=playing;seeking=true;pause()};$('seek').oninput=e=>{if(ready)seek(Number(e.target.value))};function endSeek(){if(!seeking)return;seeking=false;if(resumeAfterSeek)play()}window.addEventListener('pointerup',endSeek);$('seek').onchange=endSeek;
$('zoom').oninput=e=>setZoom(Number(e.target.value));$('fit').onclick=fit;$('center').onclick=()=>setSplit(50);$('pixels').onclick=()=>{if(!ready)return;const displayed=Math.min(stage.clientWidth/result.videoWidth,stage.clientHeight/result.videoHeight);setZoom(1/displayed)};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){notice('Plein écran indisponible : utilisez F11 dans votre navigateur.')}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Quitter plein écran':'Plein écran';transform()});
stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;const divider=e.target.closest('#divider');drag={kind:divider?'split':'pan',x:e.clientX,y:e.clientY,px:panX,py:panY};stage.setPointerCapture(e.pointerId);if(!divider)stage.classList.add('panning');if(divider){const r=stage.getBoundingClientRect();setSplit((e.clientX-r.left)/r.width*100)}e.preventDefault()});
stage.addEventListener('pointermove',e=>{if(!drag)return;if(drag.kind==='split'){const r=stage.getBoundingClientRect();setSplit((e.clientX-r.left)/r.width*100)}else{panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;transform()}});
function endDrag(){drag=null;stage.classList.remove('panning')}stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);stage.addEventListener('lostpointercapture',endDrag);
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();setZoom(zoom*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});stage.addEventListener('dblclick',fit);
$('divider').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){setSplit(split+(e.key==='ArrowRight'?2:-2));e.preventDefault();e.stopPropagation()}});
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(['ArrowLeft','ArrowRight'].includes(e.key)&&ready){e.preventDefault();pause();seek(source.currentTime+(e.key==='ArrowRight'?1:-1)/frameRate)}if(e.key==='0')fit()});
window.addEventListener('resize',transform);window.addEventListener('beforeunload',()=>{for(const item of [...sourceItems,...resultItems])if(item.url.startsWith('blob:'))URL.revokeObjectURL(item.url)});
change('both');requestAnimationFrame(tick);
</script>
</html>
