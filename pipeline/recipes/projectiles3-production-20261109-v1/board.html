<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Projectiles3 · Comparatif SeedVR7B / Apollo30</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111722;color:#edf2fa;font:14px system-ui}header{padding:24px 28px}h1{margin:0 0 10px;font-size:27px}p{color:#b5c3d9;line-height:1.6}.toolbar{position:sticky;top:0;padding:12px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#263247f5;z-index:2}button,select,input{font:inherit;border-radius:6px;border:1px solid #5f7291;background:#182438;color:inherit;padding:6px}button{cursor:pointer}label{display:flex;gap:6px;align-items:center}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(570px,1fr));gap:18px;padding:20px}article{border-radius:12px;border:1px solid #384861;background:#1b2536;overflow:hidden}h2{font-size:18px;margin:12px 16px}.pair{display:flex;gap:8px;padding:0 10px}.view{width:50%}.stage{height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#343f50}.checker .stage{background-image:conic-gradient(#4e596a 25%,transparent 0 50%,#4e596a 0 75%,transparent 0);background-size:24px 24px}.black .stage{background:#000}.terrain .stage{background:#6e5e46}.white .stage{background:#ddd}canvas{image-rendering:pixelated;max-width:100%;max-height:100%}.caption{color:#b9c8dd;font-size:12px;padding:6px 2px}.controls{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls select{max-width:240px}.phase{width:100%;accent-color:#ffb164}.meta{padding:0 16px 12px;color:#a5b8d3;font-size:12px}.hidden{display:none}a{color:#94c4ff}#counter{color:#ffcc8e}.error{color:#ff8888}@media(max-width:620px){main{grid-template-columns:1fr}.stage{height:170px}}</style>
<header><h1>3 projectiles · SeedVR7B x4 + Apollo30</h1><p>Comparatif natif / traité, cycles et horloge synchronisés. 30 FPS cible sur base15 FPS de compatibilité ; cadence ingame non mesurée.<br>Fumées BGLRYU/SPCL236U et fragments SPGLYPHI. Résultats de production : QA visuelle en attente, aucune installation en jeu.</p></header>
<div class="toolbar"><button id="play">⏸ Pause globale</button><button id="restart">↺ Recommencer</button><label>Vitesse <select id="speed"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label>Fond <select id="bg"><option value="slate">Ardoise</option><option value="checker">Damier</option><option value="black">Noir</option><option value="terrain">Terrain</option><option value="white">Clair</option></select></label><label>Mélange <select id="blend"><option value="normal">Alpha normal</option><option value="screen">Lumineux (simulation)</option></select></label><label><input type="checkbox" id="neutral">Compagnon noir neutre (halos)</label><input id="search" placeholder="Filtrer un RESREF"><span id="counter"></span></div><main></main>
<script>
const records=__CARDS__, $=s=>document.querySelector(s), cards=[], cache=new Map();let bytes=0,playing=true,time=0,last=performance.now(),speed=1;
function getImage(path){let c=cache.get(path);if(c){c.used=performance.now();return c.image}const image=new Image();c={image,ready:false,used:performance.now(),bytes:0};cache.set(path,c);image.onload=()=>{c.ready=true;c.bytes=image.naturalWidth*image.naturalHeight*4;bytes+=c.bytes;while(bytes>192*1024*1024&&cache.size>40){const oldest=[...cache].filter(([p,v])=>v.ready&&p!==path).sort((a,b)=>a[1].used-b[1].used)[0];if(!oldest)break;bytes-=oldest[1].bytes;cache.delete(oldest[0])}};image.onerror=()=>{c.error=true};image.src=path;return image}
for(const a of records){const el=document.createElement('article');el.innerHTML=`<h2>${String(a.ordinal).padStart(2,'0')} · ${a.resref}</h2><div class="pair"><div class="view"><div class="caption">Natif x4 · 15FPS</div><div class="stage"><canvas class="native"></canvas></div></div><div class="view"><div class="caption">SeedVR7B x4 · Apollo30</div><div class="stage"><canvas class="result"></canvas></div></div></div><div class="controls"><button class="pause">⏸</button><select>${a.profiles.map((p,i)=>`<option value="${i}">${p.id} · ${p.duration.toFixed(2)}s</option>`).join('')}</select><span class="phaseText"></span><input class="phase" type="range" min="0" value="0" step="1"></div><div class="meta">Lecture répétée pour revue ; profils once et loop conservés séparément.</div>`;$('main').append(el);const n=el.querySelector('.native'),r=el.querySelector('.result');for(const cv of[n,r]){cv.width=a.width;cv.height=a.height;const scale=Math.min(1,270/a.width,220/a.height);cv.style.width=a.width*scale+'px';cv.style.height=a.height*scale+'px'}const c={a,el,n,r,nctx:n.getContext('2d'),rctx:r.getContext('2d'),profile:0,start:0,phase:0,paused:false,visible:false,last:''};c.setProfile=i=>{c.profile=i;c.start=time;c.phase=0;c.last='';el.querySelector('.phase').max=a.profiles[i].frames.length-1};c.setProfile(0);el.querySelector('select').onchange=e=>c.setProfile(Number(e.target.value));el.querySelector('.pause').onclick=e=>{c.paused=!c.paused;if(!c.paused)c.start=time-c.phase/30;e.target.textContent=c.paused?'▶':'⏸'};el.querySelector('.phase').oninput=e=>{c.paused=true;c.phase=Number(e.target.value);c.last='';el.querySelector('.pause').textContent='▶'};cards.push(c)}
$('#counter').textContent=records.length+'/3 projectiles';const observer=new IntersectionObserver(es=>{for(const e of es){const c=cards.find(c=>c.el===e.target);c.visible=e.isIntersecting}},{rootMargin:'120px'});cards.forEach(c=>observer.observe(c.el));
function tick(now){if(playing)time+=(now-last)/1000*speed;last=now;for(const c of cards){if(!c.visible||c.el.classList.contains('hidden'))continue;const p=c.a.profiles[c.profile];if(!c.paused)c.phase=Math.floor((time-c.start)*30)%p.frames.length;const f=c.a.frames[p.frames[c.phase]],path=$('#neutral').checked&&f.neutral?f.neutral:f.image;const result=getImage(path),native=getImage(c.a.native.image);for(let j=1;j<=3;j++){const nf=c.a.frames[p.frames[(c.phase+j)%p.frames.length]];getImage($('#neutral').checked&&nf.neutral?nf.neutral:nf.image)}const signature=[c.profile,c.phase,path].join(':');if(result.complete&&result.naturalWidth&&native.complete&&native.naturalWidth&&c.last!==signature){c.nctx.clearRect(0,0,c.a.width,c.a.height);c.rctx.clearRect(0,0,c.a.width,c.a.height);c.nctx.imageSmoothingEnabled=false;c.rctx.imageSmoothingEnabled=false;const k=p.native[Math.floor(c.phase/2)],n=c.a.native;c.nctx.drawImage(native,k%n.cols*n.width,Math.floor(k/n.cols)*n.height,n.width,n.height,0,0,c.a.width,c.a.height);c.rctx.drawImage(result,f.x,f.y);c.el.querySelector('.phase').value=c.phase;c.el.querySelector('.phaseText').textContent=(c.phase+1)+'/'+p.frames.length;c.last=signature}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'⏸ Pause globale':'▶ Reprendre'};$('#restart').onclick=()=>{time=0;cards.forEach(c=>{c.start=0;c.phase=0;c.last=''})};$('#speed').onchange=e=>speed=Number(e.target.value);$('#bg').onchange=e=>document.body.className=e.target.value;$('#blend').onchange=e=>cards.forEach(c=>[c.n,c.r].forEach(cv=>cv.style.mixBlendMode=e.target.value));$('#neutral').onchange=()=>cards.forEach(c=>c.last='');$('#search').oninput=e=>{const q=e.target.value.trim().toUpperCase();let n=0;cards.forEach(c=>{const show=c.a.resref.includes(q);c.el.classList.toggle('hidden',!show);n+=show});$('#counter').textContent=n+'/3 projectiles'};
</script></html>
